<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360" role="img" aria-label="Microsoft AI Playground API Hero Banner">
  <defs>
    <!-- Liquid Neon Bloom Filter -->
    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Laser Beam Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Core Gradients -->
    <linearGradient id="laserAzure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0078d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#828fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#828fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laserViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <linearGradient id="subTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="barAzure" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#03254c"/>
      <stop offset="60%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barViolet" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="barMint" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Center Atmospheric Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono-meta { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 3.5px; fill: #64748b; text-transform: uppercase; }
    .wordmark-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 64px; font-weight: 900; letter-spacing: -2px; }
    .submark { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 9px; text-transform: uppercase; }
    .hud-label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; fill: #f8fafc; }
    .hud-sub { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #64748b; }
    .hex-stream { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 500; fill: #334155; }
  </style>

  <!-- 1. AMBIENT ATMOSPHERIC RADIANCE -->
  <ellipse cx="600" cy="180" rx="420" ry="150" fill="url(#centerGlow)"/>

  <!-- 2. CORNER OPTICAL BRACKETS (PRECISION RED-TEAM / CYBERNETIC AESTHETIC) -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 32 52 L 32 32 L 52 32" />
    <circle cx="32" cy="32" r="2.5" fill="#0078d4" />
    <!-- Top-Right -->
    <path d="M 1168 52 L 1168 32 L 1148 32" />
    <circle cx="1168" cy="32" r="2.5" fill="#818cf8" />
    <!-- Bottom-Left -->
    <path d="M 32 308 L 32 328 L 52 328" />
    <circle cx="32" cy="328" r="2.5" fill="#0078d4" />
    <!-- Bottom-Right -->
    <path d="M 1168 308 L 1168 328 L 1148 328" />
    <circle cx="1168" cy="328" r="2.5" fill="#818cf8" />
  </g>

  <!-- Blueprint Technical Axis Guides -->
  <line x1="80" y1="180" x2="210" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="990" y1="180" x2="1120" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 3. TRAVELING SCANNER LASER BEAMS -->
  <g opacity="0.7" filter="url(#laserGlow)">
    <rect x="0" y="31" width="380" height="2" fill="url(#laserAzure)">
      <animateTransform attributeName="transform" type="translate" from="-380 0" to="1200 0" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="327" width="380" height="2" fill="url(#laserViolet)">
      <animateTransform attributeName="transform" type="translate" from="1200 0" to="-380 0" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4. LEFT KINETIC MECHANISM: CONCENTRIC REASONING & INFERENCE RADAR -->
  <g transform="translate(138, 180)">
    <!-- Outer Azure Rotating Ring (CW) -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#0078d4" stroke-width="1.8" stroke-dasharray="16 10" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <!-- Middle Violet Segmented Ring (CCW) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="8 6 2 6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <!-- Innermost Static Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Pulsing Neural Nucleus Core -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.95" filter="url(#neonBloom)">
      <animate attributeName="r" values="7; 10.5; 7" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#38bdf8; #818cf8; #38bdf8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Crosshairs -->
    <line x1="-74" y1="0" x2="74" y2="0" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="-74" x2="0" y2="74" stroke="#1e293b" stroke-width="1"/>
    <!-- Reticle Telemetry Annotations -->
    <text x="0" y="-76" text-anchor="middle" class="mono-meta" style="font-size: 7.5px; fill: #475569;">FALCON-CaaS</text>
    <text x="0" y="84" text-anchor="middle" class="mono-meta" style="font-size: 7.5px; fill: #475569;">mai-thinking-1</text>
    <text x="-78" y="3" text-anchor="end" class="mono-meta" style="font-size: 7px; fill: #38bdf8;">tRPC</text>
    <text x="78" y="3" text-anchor="start" class="mono-meta" style="font-size: 7px; fill: #818cf8;">DUPLEX</text>
  </g>

  <!-- 5. RIGHT KINETIC MECHANISM: REALTIME SPEECH SPECTRUM & TELEMETRY STACK -->
  <g transform="translate(1010, 88)">
    <!-- Pill 1: mai-transcribe-2 33.7x RTF -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="158" height="26" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16.5" class="hud-label">mai-transcribe-2</text>
      <text x="146" y="16.5" text-anchor="end" class="hud-sub" style="fill: #34d399;">33.7x</text>
    </g>

    <!-- Pill 2: Wispr Flow Mode -->
    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="158" height="26" rx="5" fill="#090d16" stroke="#0078d4" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16.5" class="hud-label">WISPR FLOW</text>
      <text x="146" y="16.5" text-anchor="end" class="hud-sub" style="fill: #38bdf8;">&lt;1.7s</text>
    </g>

    <!-- Pill 3: 120B Falcon-CaaS -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="158" height="26" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#818cf8">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16.5" class="hud-label">FALCON 120B</text>
      <text x="146" y="16.5" text-anchor="end" class="hud-sub" style="fill: #818cf8;">REALTIME</text>
    </g>

    <!-- Pill 4: 8K Diffusion -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="158" height="26" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#f59e0b">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16.5" class="hud-label">mai-image-2.6</text>
      <text x="146" y="16.5" text-anchor="end" class="hud-sub" style="fill: #fbbf24;">8K DIFF</text>
    </g>

    <!-- Dynamic Audio Spectrum Equalizer (8 Vertical Bars) -->
    <g transform="translate(4, 142)">
      <!-- Bar 1 -->
      <rect x="0" y="0" width="6" height="34" rx="3" fill="url(#barAzure)">
        <animate attributeName="height" values="12; 34; 18; 28; 12" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22; 0; 16; 6; 22" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="18" y="0" width="6" height="34" rx="3" fill="url(#barViolet)">
        <animate attributeName="height" values="28; 14; 34; 18; 28" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6; 20; 0; 16; 6" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="36" y="0" width="6" height="34" rx="3" fill="url(#barAzure)">
        <animate attributeName="height" values="16; 30; 14; 34; 16" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18; 4; 20; 0; 18" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="54" y="0" width="6" height="34" rx="3" fill="url(#barMint)">
        <animate attributeName="height" values="34; 18; 28; 12; 34" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0; 16; 6; 22; 0" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="72" y="0" width="6" height="34" rx="3" fill="url(#barMint)">
        <animate attributeName="height" values="14; 34; 16; 28; 14" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20; 0; 18; 6; 20" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 6 -->
      <rect x="90" y="0" width="6" height="34" rx="3" fill="url(#barViolet)">
        <animate attributeName="height" values="30; 16; 34; 14; 30" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4; 18; 0; 20; 4" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 7 -->
      <rect x="108" y="0" width="6" height="34" rx="3" fill="url(#barAzure)">
        <animate attributeName="height" values="18; 28; 12; 34; 18" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="16; 6; 22; 0; 16" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 8 -->
      <rect x="126" y="0" width="6" height="34" rx="3" fill="url(#barViolet)">
        <animate attributeName="height" values="24; 14; 30; 16; 24" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10; 20; 4; 18; 10" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Hex Subtext -->
    <text x="74" y="196" text-anchor="middle" class="hex-stream">0x7F 0x45 0x4C 0x50</text>
  </g>

  <!-- 6. SWEEPING CENTER LASER SCANLINE -->
  <g filter="url(#laserGlow)">
    <line x1="280" y1="85" x2="920" y2="85" stroke="url(#laserAzure)" stroke-width="2.2">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0, 0; 0, 200; 0, 0"
        dur="3.6s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
        keyTimes="0; 0.5; 1"
      />
    </line>
  </g>

  <!-- 7. CENTER STAGE: BOLD CYBERNETIC TYPOGRAPHY -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Category Eyebrow -->
    <text x="0" y="0" class="mono-meta">
      <tspan fill="#38bdf8">//</tspan> REVERSED AUTONOMOUS PROTOCOL <tspan fill="#818cf8">//</tspan>
    </text>

    <!-- Main Wordmark -->
    <text x="0" y="58" class="wordmark-main" fill="url(#titleGrad)" filter="url(#neonBloom)">
      MICROSOFT AI
    </text>
    <text x="0" y="122" class="wordmark-main" fill="url(#titleGrad)">
      PLAYGROUND
    </text>

    <!-- Subtitle Spec -->
    <text x="0" y="160" fill="url(#subTitleGrad)" class="submark">
      DIFFUSION • 24kHZ VOICE • SPEECH ASR • 120B REALTIME
    </text>
  </g>
</svg>
